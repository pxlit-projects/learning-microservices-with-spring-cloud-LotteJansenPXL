spring.application.name=logbook-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8080}

server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/logbookservice_db?useSSL=false&serverTimezone=UCT
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
eureka.client.serviceUrl.defaultZone=http://localhost:8061/eureka/
