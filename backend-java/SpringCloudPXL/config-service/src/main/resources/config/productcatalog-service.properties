server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/productservice_db?useSSL=false&serverTimezone=UCT
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
eureka.client.serviceUrl.defaultZone=http://localhost:8061/eureka/

#n roundabout for forbidden character in hostname
notification.service.url=http://localhost:8082

# Force the service to register itself with localhost instead of computername
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=localhost:${spring.application.name}:${server.port}

